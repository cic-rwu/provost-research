title: Effect of Hands-On ACE Labs on Practical Cybersecurity Skill, Critical Thinking, and Self-Efficacy
version: 2
status: draft
funding: Provost's Fund for Student Research 2026-2027 (Round One, due 2026-10-09)

definitions:
  ACE: "<expand acronym> - a set of hands-on virtual lab environments for cybersecurity tooling"
  practical-skill: rubric score for correct technical completion of a scenario task
  critical-thinking: rubric score for explaining, justifying, and prioritizing findings/actions
  self-efficacy: self-rated confidence on domain-specific Likert items (1-5)

research-question: >
  Does structured access to hands-on lab environments (ACE) improve students'
  practical cybersecurity skill, critical thinking, and self-efficacy?

hypotheses:
  H1:
    statement: ACE students score higher on the post practical task than controls, controlling for pre-task score
    measure: practical-task technical score
    test: ANCOVA (post ~ group + pre)
  H2:
    statement: ACE students score higher on the critical-thinking component of the post practical task, controlling for pre score
    measure: practical-task explanation score
    test: ANCOVA (post ~ group + pre)
  H3:
    statement: ACE students show a larger pre-to-post gain in self-efficacy than controls
    measure: self-efficacy scale
    test: ANCOVA (post ~ group + pre)
  H4-exploratory:
    statement: Effects are larger for students with no prior homelab experience
    measure: prior-experience survey item (homelab yes/no)
    test: group x homelab interaction term; reported descriptively (underpowered)

study-design:
  type: randomized waitlist-control, pre/post (pilot)
  fallback: quasi-experimental with baseline covariates if randomization is not approved
  population: undergraduate students enrolled in cybersecurity courses
  recruitment: voluntary; participation not tied to course grades
  assignment: consenting volunteers randomized 1:1, stratified by prior homelab experience
  treatment-group: complete 5 ACE labs over 6 weeks (1 lab/week + buffer week)
  control-group: normal coursework only; receives full ACE lab access after post-test (waitlist)
  sample:
    target: 20-25 per group (40-50 total)
    minimum: 15 per group
    justification: ANCOVA with pre/post r~0.5 needs ~20/group to detect d=0.8 at alpha=.05, power=.80
    framing: pilot study; emphasis on effect sizes and confidence intervals

ace-labs:
  common-structure:
    duration: 60-90 minutes
    format: scenario brief -> guided tasks -> challenge task -> written explanation
    environment: single shared virtual network (university hardware / Proxmox), reset per student
    deliverable: completion evidence + short written justification (feeds critical-thinking practice)
  sequence:
    - id: 1
      name: firewall
      objective: Configure basic firewall rules for a segmented network and justify each rule
      platform: OPNsense
    - id: 2
      name: ids
      objective: Find a planted malicious event in IDS alerts and explain its significance
      platform: Wazuh
    - id: 3
      name: visualization
      objective: Build a security dashboard from firewall and IDS logs and interpret one anomaly
      platform: Grafana
    - id: 4
      name: vulnerability-assessment
      objective: Scan a target host, prioritize findings by risk, and recommend remediation
      platform: Greenbone/OpenVAS
    - id: 5
      name: incident-response
      objective: Investigate a simulated incident end-to-end and document a timeline and response
      platform: Elastic Stack (Elasticsearch + Kibana)
  optional-commercial-equivalents: [Splunk Free, Nessus Essentials, Palo Alto VM eval]  # only if no-cost licenses available

measures:
  pre-test:
    - instrument: background survey
      items: [year, major, prior courses, certifications, homelab experience (yes/no + months)]
    - instrument: self-efficacy scale
      items: ~15 Likert items, 3 per lab domain, adapted from a published cybersecurity self-efficacy scale
    - instrument: practical task (form A or B, counterbalanced)
      duration: 45 minutes
      scoring: rubric -> technical score (0-20) + critical-thinking score (0-20)
  during-intervention (treatment only, descriptive):
    - lab completion status, time per lab, hints requested
    - analysis: descriptive learning curves; not a hypothesis test
  post-test:
    - instrument: self-efficacy scale (same items)
    - instrument: practical task (the other form)
      scoring: same rubric
    - instrument: short exit survey (perceived usefulness, open-ended feedback)
  secondary:
    - time to complete post practical task (compared between groups, Mann-Whitney U)

scoring:
  rubric: analytic rubric; critical-thinking dimension adapted from the AAC&U Critical Thinking VALUE rubric
  graders: 2 graders, blind to group and to pre/post
  reliability: Cohen's weighted kappa / ICC on all tasks; target >= 0.70; disagreements resolved by discussion
  form-equivalence: forms A and B piloted with 3-5 non-participants before the study

analysis:
  primary: ANCOVA per hypothesis (post ~ group + pre), alpha = .05
  assumptions: check normality/homogeneity; fallback to Mann-Whitney U on gain scores
  effect-size: Hedges' g with 95% CI
  multiple-comparisons: Holm correction across H1-H3
  baseline-check: compare groups on pre-test scores and background (descriptive, not significance-tested)
  missing-data: report attrition per group; analyze completers + intention-to-treat sensitivity
  qualitative: thematic coding of exit-survey responses
  tools: R or Python (statsmodels / scipy)

threats-to-validity:
  - small sample -> pilot framing, effect sizes
  - contamination (controls accessing labs) -> lab access gated per account
  - testing effect -> counterbalanced parallel forms
  - grader bias -> blinding + two graders
  - attrition -> short intervention, reminders, completion incentive if budget allows

ethics:
  - IRB approval before recruitment
  - informed consent; right to withdraw without penalty
  - participation independent of course grades
  - de-identified data via participant codes; stored on university storage
  - waitlist control ensures every participant gets lab access

timeline:
  2026-10-09: submit Round One application
  2026-10 to 2026-11: IRB submission; finalize rubric and task forms A/B
  2026-11-02: award notification
  2026-11 to 2026-12: build lab environment; pilot labs and forms
  2027-01: recruit, consent, randomize, pre-test
  2027-02 to 2027-03: 6-week intervention
  2027-03: post-test; open labs to control group
  2027-04: scoring, reliability check, analysis
  2027-05: write-up, poster/paper
  2027-05 to 2027-06-14: present at conference/university symposium; all funds spent before 2027-06-15

budget:  # project max $1,500; research costs max $300
  research-costs:
    - item: lab hosting / cloud credits or hardware consumables
      amount: <= 300
  presentation-costs:
    - item: conference registration (student)
    - item: transportation
    - item: lodging (<= 2 nights)
  total: <= 1500
  note: open-source platforms keep software licensing at $0

dissemination:
  - university research symposium poster
  - submission to a cybersecurity education venue (e.g., CISSE, regional NICE/ACM conference)
  - final product lists student name(s) and acknowledges the University's Provost's Fund support
