hypothesis: Does access to hands-on environments improve students practical knowledge and critical thinking skills in Cybersecurity?

sub-hypothesis:
  H1:
    statement: Freshmen who utilize ACE labs will have similar times on the exit lab, in contrast to seniors who dont utilize ACE
    measure: difference in time to finish the exit lab

  H2:
    statement: ACE students score higher on the critical-thinking component of the post practical task
    measure: practical-task explanation score
  
  exploratory:
    H3:
      statement: Effects are larger for students with no prior homelab experience

definitions:
  ace: |
    Advanced Collaboration Environment
    A student-maintained network for development

study-design:
  type: quasi-experimental with pre/post measurements
  treatment-group: students who complete a set of ACE labs over a fixed period
  control-group: students who do not complete the ACE labs
  sample: 10-15 students in each group

ace-labs:
  - IDS: Find a planted event inside an IDS and explain it
    platform: 
      - wazuh
      - splunk

  - firewall: Configure a basic firewall rule and explain its purpose
    platform: 
      - pfsense
      - opnsense
      - palo alto

  - visualization: build a simple visualization dashboard
    platform: 
      - grafana
  
  - vulnerability-assessment: Identify and analyze vulnerabilities in a given system
    platform: 
      - nessus
      - openvas
  
  - incident-response: Respond to a simulated security incident and document the steps taken
    platform: 
      - elasticsearch
      - kibana

measures:
  pre-experiment:
    - survey: students are given a pre-test survey to assess their baseline knowledge and confidence levels
      analysis: compare students self-rated confidence between the treatment and control groups

  mid-experiment:
    - timed-labs: cumulative time to complete labs are recorded 
      analysis: compare cumulative lab time to final lab time

  post-experiment:
    - survey: students are given a post-test survey to assess their knowledge and confidence levels after the intervention
      analysis: compare students self-rated confidence between the treatment and control groups

    - final-lab: students complete a final assessment lab to demonstrate their skills
      analysis: compare times between groups